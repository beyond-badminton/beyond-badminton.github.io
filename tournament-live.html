<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="color-scheme" content="light dark">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="Live read-only tournament matches and player standings.">
		<title>Live Tournament | Beyond Badminton</title>
		<link rel="stylesheet" href="assets/css/styles.css">
	</head>
	<body class="tournament-live-page">
		<main class="tournament-live-app">
			<div class="tournament-live-layout">
				<section class="card tournament-live-panel" aria-label="Qualification matches">
					<div class="tournament-live-panel-heading">
						<div>
							<p class="gen-table-label">On court</p>
						</div>
					</div>
					<div id="qualification-edit-filter-wrap" hidden>
						<div class="checkbox-group">
							<label class="gen-checkbox-label" for="qualification-edit-filter-editable">
								<input type="checkbox" id="qualification-edit-filter-editable" checked>
								Show editable matches only
							</label>
						</div>
						<div class="checkbox-group">
							<label class="gen-checkbox-label" for="qualification-edit-filter-draw-numbers">
								<input type="checkbox" id="qualification-edit-filter-draw-numbers">
								Show drawn numbers
							</label>
						</div>
					</div>
					<div class="gen-collapsible gen-collapsed" id="qualification-match-filter-wrap">
						<div class="gen-table-label gen-card-toggle" id="qualification-match-filter-label">
							<span class="gen-collapse-arrow">▾</span>
							Filter players &amp; matches (<span id="qualification-match-filter-count"></span>)
						</div>
						<div class="checkbox-filter-controls">
							<input type="search" id="qualification-match-filter-search" placeholder="Search player…">
							<button type="button" id="qualification-match-filter-all-btn" class="select-btn">Select all</button>
							<button type="button" id="qualification-match-filter-none-btn" class="clear-btn">Clear all</button>
							<div class="align-top">
								<div class="checkbox-group">
									<label class="gen-checkbox-label" for="qualification-match-filter-active-window">
										<input type="checkbox" id="qualification-match-filter-active-window">
										<span id="qualification-match-filter-active-window-label">Show active 4-round window</span>
									</label>
									<span class="help-icon" title="Shows the last finished round, current round, and next two rounds.">?</span>
								</div>
								<div class="checkbox-group">
									<label class="gen-checkbox-label" for="qualification-match-filter-no-bench">
										<input type="checkbox" id="qualification-match-filter-no-bench">
										Show only matches and no bench
									</label>
									<span class="help-icon" title="Hides benched players.">?</span>
								</div>
							</div>
							<div class="align-top">
								<div class="checkbox-group">
									<label class="gen-checkbox-label" for="qualification-match-filter-drawn-numbers">
										<input type="checkbox" id="qualification-match-filter-drawn-numbers">
										Show drawn numbers
									</label>
									<span class="help-icon" title="Shows each player's draw number before their name.">?</span>
								</div>
							</div>
						</div>
						<div id="qualification-match-player-filter" class="checkbox-list checkbox-filter-list"></div>
					</div>
					<div id="gen-qualification-output" aria-live="polite"></div>
				</section>

				<section class="card tournament-live-panel" aria-label="Qualification standings" style="margin-top: 0">
					<div class="tournament-live-panel-heading">
						<div>
							<p class="gen-table-label">Current standings</p>
						</div>
					</div>
					<div class="checkbox-group table-fit-control">
						<label class="gen-checkbox-label" for="qualification-stats-fit">
							<input type="checkbox" id="qualification-stats-fit">
							Auto-resize table to fit all rows
						</label>
					</div>
					<div class="gen-stats-table-wrap tournament-live-table-wrap">
						<table class="gen-stats-table" id="qualification-stats-table">
							<thead></thead>
							<tbody id="qualification-stats-table-body"></tbody>
						</table>
					</div>
				</section>
			</div>
		</main>
		<script src="assets/js/common.js"></script>
		<script src="assets/js/schedule.common.js"></script>
		<script src="assets/js/drag-and-drop.js"></script>
		<script src="assets/js/tournament.common.js"></script>
		<script src="assets/js/tournament.ranking.js"></script>
		<script src="assets/js/tournament.base.js"></script>
		<script src="assets/js/tournament.rounds.js"></script>
		<script src="assets/js/tournament.playerstats.js"></script>
		<script src="assets/js/tournament.live.js"></script>
	</body>
</html>
